<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sisteme Giriş</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <h2>Sisteme Giriş</h2>
        
        <form id="girisForm">
            <div class="input-group">
                <label for="ad">Adınız</label>
                <input type="text" id="ad" required placeholder="Adınızı giriniz">
            </div>
            <div class="input-group">
                <label for="tc">TC Kimlik No</label>
                <input type="text" id="tc" required placeholder="11 Haneli TC Kimlik No" oninput="tcKontrol(this)">
            </div>

            <button type="submit">Giriş Yap</button>
        </form>
        
        <a href="kayıt.html" class="link">Hesabınız yok mu? Yeni hasta kaydı oluşturun.</a>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
